server:
  port: 8060
spring:
  application:
    name: clinical-assistant

  ai:
    model:
      # Which chat provider is active: "anthropic" (default, needs ANTHROPIC_API_KEY) or "ollama" (fully local, no key).
      chat: ${CHAT_PROVIDER:ollama}
      embedding: ollama
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-sonnet-5
          temperature: 0.0
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.1}
          temperature: 0.0
      embedding:
        options:
          model: nomic-embed-text
    vectorstore:
      pgvector:
        initialize-schema: true
        table-name: vector_store
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/clinical_assistant}
    username: ${DB_USERNAME:clinical_assistant}
    password: ${DB_PASSWORD:clinical_assistant}

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

clinical-assistant:
  ingestion:
    catalog-path: classpath:data/icd_catalog.json
    guideline-path: classpath:data/guideline_snippets.json
  retrieval:
    top-k: 5
    similarity-threshold: 0.5
  workflow:
    max-iterations: 3
