services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: clinical-assistant-postgres
    environment:
      POSTGRES_DB: clinical_assistant
      POSTGRES_USER: clinical_assistant
      POSTGRES_PASSWORD: clinical_assistant
    ports:
      - "5433:5432"
    volumes:
      - clinical-assistant-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinical_assistant -d clinical_assistant"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  clinical-assistant-pgdata:
